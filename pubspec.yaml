name: video_player_example
description: Demonstrates how to use the video_player plugin.
publish_to: none
# 加号后为 build number，即 Android versionCode（flutter 构建时会写入 local.properties）
# 每次发布必须递增，否则商店拒收、用户无法覆盖安装
version: 6.0.1+601

environment:
  sdk: ^3.1.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fijkplayer_ijkfix: ^0.0.11

  # 状态管理
  # get: ^4.6.6
  get_it: ^7.6.7
  mobx: ^2.3.3+1
  flutter_mobx: ^2.2.1+1

  # 工具
  xml: ^6.5.0
  collection: ^1.18.0
  json_annotation: ^4.8.1
  package_info_plus: ^4.2.0
  retry: ^3.1.2
  pretty_qr_code: ^3.3.0
    # 网络
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  html: ^0.15.0
  # 日志
  talker: ^4.1.3
  talker_flutter: ^4.1.3
  # 数据存储
  shared_preferences: ^2.2.2
  # 界面适配
  flutter_screenutil: ^5.9.0
  # 国际化
  intl: ^0.18.1

  path_provider: any
dev_dependencies:
  build_runner: ^2.1.10
  test: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # 注意：不要再声明 assets/json/。内置源已由服务端下发、shell 里可配置默认源服务，
  # 仓库按红线不存任何直播源。声明一个 gitignore 掉的空目录会让 clone 下来的人
  # 在 flutter build 阶段直接失败（Unable to find directory）。
  assets:
    - assets/
    - assets/web/
    - assets/images/
