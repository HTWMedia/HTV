def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    // 注意：flutter 构建时会重写 local.properties，手写的 flutter.versionCode 会被清掉。
    // versionCode 的真正来源是 pubspec.yaml 的 version: x.y.z+N（N 即 build number）。
    // 兜底为 1 会让每次打包的 versionCode 都相同，商店拒收、用户无法覆盖安装，故显式告警。
    flutterVersionCode = '1'
    println('[WARN] 未取到 flutter.versionCode，versionCode 将回退为 1 —— 请在 pubspec.yaml 设置 version: x.y.z+N')
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ─── 签名配置 ─────────────────────────────
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'kotlin-android'

android {
    namespace 'com.htwmedia.htv'
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.htwmedia.htv"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 29
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

//    packagingOptions {
//        exclude 'lib/**/libflutter.so'
//        exclude 'lib/**/libapp.so'
//    }

    // 签名配置：从 keystore.properties 读取
    if (hasKeystore && keystoreProperties['storeFile'] != null) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore && keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('未找到有效的 keystore.properties，将使用 debug 签名。')
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    lint {
        disable 'InvalidPackage'
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def apkName = "HTV-${variant.versionName}"
            outputFileName = new File(apkName + ".apk")
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
}
